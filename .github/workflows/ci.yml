name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zentral
          POSTGRES_PASSWORD: zentral
          POSTGRES_DB: zentral_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zentral" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-groups --all-extras
      - run: uv run ruff format --check src tests scripts
      - run: uv run ruff check src tests scripts
      - run: uv run mypy
      - name: Security lint
        run: uv run bandit -q -r src -c pyproject.toml
      - name: Tests (SQLite)
        run: uv run pytest --cov --cov-report=term-missing:skip-covered
      - name: Tests (PostgreSQL)
        env:
          ZENTRAL_TEST_DATABASE_URL: postgresql+asyncpg://zentral:zentral@localhost:5432/zentral_test
        run: uv run pytest
      - name: Dependency audit
        run: uv run pip-audit

  web:
    name: Web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-groups
      - name: Generated reference tables are current
        run: uv run python scripts/gen_docs.py --check
      - run: uv run mkdocs build --strict

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t zentral:ci .
      - name: Image starts and passes its own pre-flight
        run: |
          docker run --rm zentral:ci keys generate > keys.env
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --env-file keys.env \
            -e ZENTRAL_ENV=development -e ZENTRAL_AUTH_MODE=dev \
            -e ZENTRAL_DATABASE_URL=sqlite+aiosqlite:////tmp/z.db \
            --entrypoint sh zentral:ci -c "zentral db upgrade && zentral doctor"
      - name: Compose file is valid
        working-directory: deploy/compose
        run: |
          cp .env.example .env && sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' .env
          docker compose config --quiet

# TLS is terminated at the ingress. Annotations are for ingress-nginx; adapt them
# to your controller. The body-size limit leaves room for attachments (10 MiB files,
# webhooks with up to three base64 files); Zentral enforces the exact limits per route.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zentral
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 48m
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: [servicedesk.example.com]
      secretName: zentral-tls
  rules:
    - host: servicedesk.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zentral-api
                port: { name: http }

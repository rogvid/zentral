# Used for authoring migrations (`alembic revision --autogenerate -m "..."`).
# At runtime use `zentral db upgrade`, which needs no ini file.
[alembic]
script_location = src/zentral/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s

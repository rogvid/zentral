[project]
name = "zentral"
version = "0.1.0"
description = "Zentral — a privacy-first, AI-friendly service desk"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.10",
    "cryptography>=44",
    "structlog>=24.4",
    "mcp>=1.20",
    "typer>=0.15",
    "email-validator>=2.4.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]

[project.scripts]
zentral = "zentral.cli:app"

[project.entry-points."zentral.connectors"]
webhook = "zentral.connectors.webhook:WebhookConnector"
teams = "zentral.connectors.teams:TeamsConnector"
email_graph = "zentral.connectors.email_graph:GraphMailConnector"

[project.entry-points."zentral.ai_providers"]
rules = "zentral.ai.providers.rules:RulesProvider"
openai_compatible = "zentral.ai.providers.openai_compatible:OpenAICompatibleProvider"
anthropic = "zentral.ai.providers.anthropic:AnthropicProvider"
claude_cli = "zentral.ai.providers.claude_cli:ClaudeCliProvider"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "bandit>=1.8",
    "anthropic>=1.0",
]
docs = ["mkdocs-material>=9.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zentral"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_default_fixture_loop_scope = "function"
markers = ["live_ai: calls a real AI provider (opt-in via ZENTRAL_LIVE_AI=1)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "C4", "SIM", "RUF", "PT", "DTZ"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"src/zentral/api/**" = ["B008"]
"src/zentral/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.coverage.run]
source = ["src/zentral"]
branch = true

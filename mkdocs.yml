site_name: Zentral
site_description: A privacy-first, AI-friendly service desk
# No repo_url on purpose: the theme would then make every reader's browser call
# GitHub's API. A plain link (extra.social) does not.
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
  # Same identity as the application; no web fonts fetched from third parties.
  font: false
  logo: assets/mark.svg
  favicon: assets/mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }

extra_css:
  - assets/zentral.css

# Mermaid is served from this site (see docs/hooks.py), not from a CDN.
extra_javascript:
  - assets/javascripts/mermaid.min.js

hooks:
  - docs/hooks.py

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rogvid/zentral
      name: Source code

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: { alternate_style: true }


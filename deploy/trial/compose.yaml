# Zentral trial on one VPS — no identity provider, no KMS, no cloud account.
#
#   cd deploy/trial
#   ./setup.sh            # writes .env, builds and starts everything
#   docker compose run --rm seed     # optional: sample teams, systems and tickets
#
# Sign-in is the built-in persona picker (pick "Ada Admin", "Arne Agent", …),
# behind a password that Caddy asks for. Keys are plain text in .env.
# This is for evaluation with made-up data. For real use, see
# docs/operations/deploy-compose.md.
#
# Topology: caddy (TLS + trial password) → api ─┐
#                                     worker ─┴→ db

name: zentral-trial

x-zentral: &zentral
  image: ${ZENTRAL_IMAGE:-zentral:local}
  build:
    context: ../..
  env_file: .env
  environment:
    # The image defaults to production, which (rightly) refuses persona sign-in.
    ZENTRAL_ENV: development
    ZENTRAL_AUTH_MODE: dev
    ZENTRAL_PUBLIC_BASE_URL: https://${ZENTRAL_HOSTNAME:?run ./setup.sh first}
    # 127.0.0.1: the image's health check · api: the seed job on the internal network
    ZENTRAL_ALLOWED_HOSTS: ${ZENTRAL_HOSTNAME},127.0.0.1,api
    ZENTRAL_DATABASE_URL: postgresql+asyncpg://zentral:${POSTGRES_PASSWORD:?run ./setup.sh first}@db:5432/zentral
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  user: "10001:10001"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zentral
      POSTGRES_USER: zentral
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zentral -d zentral"]
      interval: 5s
      timeout: 3s
      retries: 20
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]

  # Applies schema migrations, then exits. api and worker wait for it.
  migrate:
    <<: *zentral
    command: ["db", "upgrade"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
    networks: [backend]

  api:
    <<: *zentral
    # One process: the persona sign-in signs tokens with a per-process key.
    # Trust X-Forwarded-* only from Caddy's network.
    command: ["serve", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "172.31.0.0/24"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [edge, backend]

  worker:
    <<: *zentral
    command: ["worker"]
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend, egress]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ZENTRAL_HOSTNAME: ${ZENTRAL_HOSTNAME}
      TRIAL_USER: ${TRIAL_USER:?run ./setup.sh first}
      TRIAL_PASSWORD_HASH: ${TRIAL_PASSWORD_HASH:?run ./setup.sh first}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
    networks: [edge, egress]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  # Sample data: docker compose run --rm seed
  seed:
    <<: *zentral
    profiles: [seed]
    restart: "no"
    entrypoint: ["python", "/opt/seed_demo.py", "http://api:8000"]
    command: []
    volumes:
      - ../../scripts/seed_demo.py:/opt/seed_demo.py:ro
    depends_on:
      api: { condition: service_healthy }
    networks: [backend]

networks:
  edge:
    ipam:
      config:
        - subnet: 172.31.0.0/24
  backend:
    internal: true # no route to the outside world
  egress: {} # Caddy: certificates · worker: model server or mail, if you add them

volumes:
  db-data:
  caddy-data:
  caddy-config:

[project]
name = "zentral-connector-slack"
version = "0.1.0"
description = "Example Zentral connector: raise tickets from Slack (Events API)"
requires-python = ">=3.12"
dependencies = ["zentral"]

# This entry point is how Zentral finds the connector. The name must match
# `SlackConnector.name` and be listed in ZENTRAL_ENABLED_CONNECTORS.
[project.entry-points."zentral.connectors"]
slack = "zentral_connector_slack:SlackConnector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zentral_connector_slack"]

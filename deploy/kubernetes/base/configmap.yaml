# Non-secret configuration. The database URL lives in the Secret
# `zentral-secrets`, which you create yourself or sync from a vault
# (External Secrets Operator, CSI driver, sealed-secrets).
apiVersion: v1
kind: ConfigMap
metadata:
  name: zentral-config
data:
  ZENTRAL_ENV: production
  ZENTRAL_PUBLIC_BASE_URL: https://servicedesk.example.com
  ZENTRAL_ALLOWED_HOSTS: servicedesk.example.com
  ZENTRAL_AUTH_MODE: entra
  ZENTRAL_ENTRA_TENANT_ID: "00000000-0000-0000-0000-000000000000"
  ZENTRAL_ENTRA_API_CLIENT_ID: "00000000-0000-0000-0000-000000000000"
  ZENTRAL_ENTRA_SPA_CLIENT_ID: "00000000-0000-0000-0000-000000000000"
  # Keys: a keyring wrapped by Azure Key Vault, unwrapped with the pods'
  # workload identity (docs/operations/key-custody.md). The keyring itself is
  # the ConfigMap `zentral-keyring`, created with `zentral keys init`.
  ZENTRAL_KEY_PROVIDER: azure_keyvault
  ZENTRAL_AZURE_KEYVAULT_KEY_ID: https://your-vault.vault.azure.net/keys/zentral-kek
  ZENTRAL_KEYRING_FILE: /etc/zentral/keys/keyring.json
  ZENTRAL_AI_PROVIDER: rules
  ZENTRAL_RETENTION_DAYS: "365"

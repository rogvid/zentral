# The identity API and worker run as. With AKS workload identity it is federated
# to an Entra managed identity that may only *unwrap* with the Key Vault key
# (docs/operations/key-custody.md). For Vault Transit with Kubernetes auth, bind
# a Vault role to this service account instead.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zentral
  annotations:
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"
automountServiceAccountToken: false

# Zentral on a single host.
#
#   cd deploy/compose
#   cp .env.example .env && $EDITOR .env      # or: zentral init --output .env
#   docker compose up -d
#   docker compose run --rm api doctor
#
# Topology: caddy (TLS) → api ─┐
#                      worker ─┴→ db          (+ optional on-prem model: --profile ai)
#
# Only Caddy publishes ports. The database and the model server sit on an
# internal network with no route to or from the internet.

name: zentral

x-zentral: &zentral
  image: ${ZENTRAL_IMAGE:-zentral:local}
  build:
    context: ../..
  env_file: .env
  environment:
    ZENTRAL_DATABASE_URL: postgresql+asyncpg://zentral:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/zentral
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  user: "10001:10001"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zentral
      POSTGRES_USER: zentral
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zentral -d zentral"]
      interval: 5s
      timeout: 3s
      retries: 20
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]

  # Applies schema migrations, then exits. api and worker wait for it.
  migrate:
    <<: *zentral
    command: ["db", "upgrade"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
    networks: [backend]

  api:
    <<: *zentral
    # Trust X-Forwarded-* only from the reverse proxy's network.
    command: ["serve", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "172.30.0.0/24"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [edge, backend, egress]

  worker:
    <<: *zentral
    command: ["worker"]
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend, egress]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ZENTRAL_HOSTNAME: ${ZENTRAL_HOSTNAME:?set ZENTRAL_HOSTNAME in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
    networks: [edge, egress]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  # On-prem model server. Start with: docker compose --profile ai up -d
  # then: docker compose exec ollama ollama pull llama3.1:8b
  ollama:
    profiles: [ai]
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks: [backend, egress]

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backend:
    internal: true # no route to the outside world
  egress: {} # outbound: identity provider, Microsoft Graph, model downloads

volumes:
  db-data:
  caddy-data:
  caddy-config:
  ollama-data:

# Background worker: AI classification, mailbox polling, reply delivery, retention.
# Safe to run several replicas — jobs are claimed with SELECT … FOR UPDATE SKIP LOCKED.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zentral-worker
  labels:
    app.kubernetes.io/name: zentral-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zentral-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zentral-worker
        zentral.dev/db-client: "true"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: zentral
          args: ["worker"]
          envFrom:
            - configMapRef: { name: zentral-config }
            - secretRef: { name: zentral-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 16Mi }

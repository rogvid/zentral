apiVersion: apps/v1
kind: Deployment
metadata:
  name: zentral-api
  labels:
    app.kubernetes.io/name: zentral-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: zentral-api
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zentral-api
        zentral.dev/db-client: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: zentral-api
      containers:
        - name: api
          image: zentral
          # The ingress controller is the only client; trust its X-Forwarded-* headers.
          # Narrow --forwarded-allow-ips to your ingress controller's pod CIDR.
          args: ["serve", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: zentral-config }
            - secretRef: { name: zentral-secrets }
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: zentral-api
spec:
  selector:
    app.kubernetes.io/name: zentral-api
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zentral-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zentral-api
